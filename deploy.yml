- name: Create users from CSV
  hosts: useradmin
  become: true
  tasks:
    - name: Copy script
      ansible.builtin.copy:
        src: parsecsv.sh
        dest: /usr/local/sbin/parsecsv.sh
        owner: root
        group: root
        mode: "0755"

    - name: Copy user CSV
      ansible.builtin.copy:
        src: users.csv
        dest: /root/users.csv
        owner: root
        group: root
        mode: "0600"

    - name: Copy Kerberos keytab
      ansible.builtin.copy:
        src: files/parsecsv.keytab
        dest: /etc/parsecsv.keytab
        owner: root
        group: root
        mode: "0600"
      when: dc_url is defined

    - name: Get Kerberos ticket
      ansible.builtin.command: kinit -k -t /etc/parsecsv.keytab svc-useradmin
      when: dc_url is defined

    - name: Create users from CSV
      ansible.builtin.command: /usr/local/sbin/parsecsv.sh /root/users.csv
      environment:
        DC_URL: "{{ dc_url | default('') }}"

    - name: Remove Kerberos ticket
      ansible.builtin.command: kdestroy
      when: dc_url is defined
